name: Auto Update Climate Data 
on: 
  schedule: 
    - cron: '0 0 * * 0' 
  workflow_dispatch: 
jobs: 
  update: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v3 
      - name: Fetch NASA 
        run: mkdir -p data/live && curl -s "https://power.larc.nasa.gov/api/temporal/daily/point?parameters=T2M,PRECTOTCORR^&community=AG^&longitude=47.78^&latitude=30.50^&start=20240101^&end=20241231^&format=JSON" -o data/live/basra_nasa.json 
      - name: Commit 
          git config user.name "Climate Bot" 
          git config user.email "bot@climate.lab" 
          git add data/live/ 
          git commit -m "auto update $(date)" || echo "no change" 
          git push 
