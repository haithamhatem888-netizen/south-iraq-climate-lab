name: V4 AUTO Climate Update

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-climate-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch NASA POWER Data for South Iraq
        run: |
          mkdir -p data/live
          echo "Fetching Basra..."
          curl -s "https://power.larc.nasa.gov/api/temporal/daily/point?parameters=T2M,PRECTOTCORR,RH2M,WS2M&community=AG&longitude=47.78&latitude=30.50&start=20240101&end=20241231&format=JSON" -o data/live/basra_nasa.json || echo '{"error":"fetch failed"}' > data/live/basra_nasa.json
          echo "Fetching Nasiriyah..."
          curl -s "https://power.larc.nasa.gov/api/temporal/daily/point?parameters=T2M,PRECTOTCORR,RH2M,WS2M&community=AG&longitude=46.26&latitude=31.05&start=20240101&end=20241231&format=JSON" -o data/live/nasiriyah_nasa.json || echo '{"error":"fetch failed"}' > data/live/nasiriyah_nasa.json
          echo "{\"last_update\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"developer\": \"Haitham Hatem - Nasiriyah\", \"source\": \"NASA POWER API\", \"status\": \"success\"}" > data/live/last_update.json
          ls -lh data/live/

      - name: Commit and Push
        run: |
          git config user.name "Haitham Climate Bot"
          git config user.email "haithamhatem888-netizen@users.noreply.github.com"
          git add data/live/
          git diff --staged --quiet || git commit -m "auto: update NASA live data - $(date -u +%Y-%m-%d) - هيثم حاتم"
          git push || echo "No changes to push"
