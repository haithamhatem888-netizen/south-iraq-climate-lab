<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مختبر مناخ جنوب العراق V4 - أوتوماتيك - هيثم حاتم</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body{margin:0;font-family:'Segoe UI',Tahoma;background:#0f172a;color:#fff}
.header{background:#1e293b;padding:10px;text-align:center;border-bottom:3px solid #22c55e;display:flex;justify-content:space-between;align-items:center}
.header h1{margin:0;color:#22c55e;font-size:20px}
.live{ background:#22c55e; color:#000; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:bold; animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.container{display:flex;height:calc(100vh - 60px)}
.sidebar{width:360px;background:#1e293b;padding:12px;overflow-y:auto}
.layer{ background:#334155; margin:5px 0; padding:9px; border-radius:8px; cursor:pointer; border-right:4px solid transparent; font-size:13px}
.layer.active{ background:#16a34a}
#map{flex:1}
.stats{background:#0f172a;padding:12px;border-radius:8px;margin-top:10px;font-size:12.5px;line-height:1.7;max-height:500px;overflow-y:auto}
.source{font-size:10px;color:#94a3b8;border-top:1px solid #334155;margin-top:8px;padding-top:6px}
.btn{ background:#38bdf8; color:#000; border:0; padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:bold; width:100%; margin-top:8px}
.btn:hover{background:#0ea5e9}
</style>
</head>

<div class="header">
<div><h1>🌍 مختبر مناخ جنوب العراق V4 AUTO</h1><small style="color:#94a3b8">هيثم حاتم - الناصرية | تحديث تلقائي NASA</small></div>

</div>
<div class="container">
<div class="sidebar" id="sidebar"></div>
<div id="map"></div>
</div>

<script>
const REAL_DB = {
 "🌡️ حرارة حية - NASA": { color:"#ef4444", data:{}, source:"NASA POWER - تحديث أسبوعي تلقائي", live:true },
 "🌧️ أمطار حية - NASA": { color:"#60a5fa", data:{}, source:"NASA POWER - تحديث أسبوعي", live:true },
 "🌊 أنهار - وزارة الموارد": { color:"#38bdf8", data:{"دجلة - العمارة":"654 م³/ثا (2023) -46% منذ 1980","الفرات - الناصرية":"362 م³/ثا -55%","شط العرب ملوحة":"12,000 ppm (2023)"}, source:"وزارة الموارد المائية 2023" },
 "🏜️ تصحر - وزارة البيئة": { color:"#fbbf24", data:{"ذي قار متصحرة":"58.7%","زحف كثبان":"2.3 كم/سنة","أراضي خسرت":"-34% منذ 2000"}, source:"تقرير التصحر 2022" }
};

const map = L.map('map').setView([31.15,46.3],7.5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let markers = L.layerGroup().addTo(map);
const cities = [[30.5,47.78,'البصرة'],[31.05,46.26,'الناصرية'],[31.33,45.28,'السماوة'],[31.84,47.14,'العمارة']];

async function loadLive(){
 document.getElementById('liveBadge').innerText="⏳ جلب بيانات NASA...";
 try{
  const data = await updateAll();
  // حدث الطبقات الحية
  Object.keys(data.data).forEach(k=>{
    const d = data.data[k];
    if(!d.error){
      REAL_DB["🌡️ حرارة حية - NASA"].data[d.city] = `معدل 30 يوم: ${d.avg_temp_last30}°م | أعلى: ${d.max_temp_last30}°م`;
      REAL_DB["🌧️ أمطار حية - NASA"].data[d.city] = `مجموع 30 يوم: ${d.total_rain_last30} ملم`;
    }
  });
  document.getElementById('liveBadge').innerText=`● LIVE - آخر تحديث: ${new Date().toLocaleDateString('ar-IQ')}`;
  renderSidebar();
  showLayer("🌡️ حرارة حية - NASA",0);
 }catch(e){
  document.getElementById('liveBadge').innerText="⚠️ فشل - يعرض بيانات محفوظة";
  renderSidebar();
 }
}

function renderSidebar(){
 const sidebar = document.getElementById('sidebar');
 let html = '<h3>📊 طبقات (4 حية + موثقة)</h3>';
 Object.keys(REAL_DB).forEach((k,i)=>{
   const liveIcon = REAL_DB[k].live ? '🔴' : '📚';
   html+=`<div class="layer" id="l-${i}" onclick="showLayer('${k}',${i})">${liveIcon} ${k}</div>`;
 });
 html+=`<button class="btn" onclick="loadLive()">🔄 تحديث الآن من NASA</button><div class="stats" id="info"></div>`;
 html+=`<div class="source"><b>طريقة الأوتوماتيك:</b><br>1- هذا الملف يجلب من NASA مباشرة<br>2- GitHub Actions يحدث كل أحد تلقائياً<br>3- بدون مفتاح API لـ NASA<br><br><b>لـ OpenWeather (اختياري):</b><br>سجل في openweathermap.org مجاناً وخد API Key وضعه في السطر 15 في auto-update.js</div>`;
 sidebar.innerHTML=html;
}

function showLayer(key, idx){
 document.querySelectorAll('.layer').forEach(x=>x.classList.remove('active'));
 document.getElementById('l-'+idx).classList.add('active');
 markers.clearLayers();
 const item = REAL_DB[key];
 let info = `<b style="color:${item.color}">${key}</b><br><br>`;
 Object.entries(item.data).forEach(([k,v])=>{ info+=`• <b>${k}:</b> ${v}<br><br>`; });
 info+=`<div class="source">📚 ${item.source}<br>👨‍💻 هيثم حاتم</div>`;
 document.getElementById('info').innerHTML=info;
 cities.forEach(c=>{ L.circleMarker([c[0],c[1]],{radius:9,fillColor:item.color,color:'#fff',weight:2,fillOpacity:0.9}).addTo(markers).bindPopup(`<b>${c[2]}</b><br>${key}`); });
}

renderSidebar();
loadLive();
</script>
</body>
